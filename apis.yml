aid: vivodyne
name: Vivodyne
description: Vivodyne is a bio-AI company working to make human biology computable through large-scale
  human tissue engineering. Its TissueDisk platform cultivates hundreds of self-assembling, vascularized
  human tissues on a single microfluidic disk, and its autonomous HIVE robotic labs cultivate, perturb,
  and analyze thousands of tissues to generate multi-modal phenomic, transcriptomic, and proteomic data
  at single-cell resolution for pharmaceutical drug discovery and AI model training. The company operates
  as a B2B partner to pharma and does not publish a public developer API; this profile tracks its public
  web surface within the API Evangelist network.
